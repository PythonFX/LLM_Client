[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llm_client"
version = "0.1.0"
description = "Unified LLM client for OpenAI, Azure, and Anthropic"
requires-python = ">=3.10"
dependencies = [
    "httpx",
    "pydantic",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["llm_client*"]
